name: Build package repository

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "aur-dependencies-x86_64.txt"
      - ".github/workflows/build-repository.yaml"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: package-repository-x86_64
  cancel-in-progress: false

env:
  REPO_NAME: moozliisp-arch
  RELEASE_TAG: repository-x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git sudo pacman-contrib

      - name: Configure resilient downloads
        run: |
          cat >>/etc/makepkg.conf <<'MAKEPKG'
          DLAGENTS=('https::/usr/bin/curl -qgC - --retry 12 --retry-delay 5 --retry-all-errors -fL -o %o %u'
                    'http::/usr/bin/curl -qgC - --retry 12 --retry-delay 5 --retry-all-errors -fL -o %o %u')
          MAKEPKG

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd --create-home builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >/etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build AUR dependencies
        run: |
          set -euo pipefail
          install -d -o builder -g builder "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/aur-build"

          while IFS= read -r pkg; do
            [[ -n "$pkg" && "$pkg" != \#* ]] || continue
            echo "::group::AUR dependency: $pkg"
            for attempt in 1 2 3 4 5; do
              rm -rf "aur-build/$pkg"
              if runuser -u builder -- git -c http.version=HTTP/1.1 clone --depth 1 "https://aur.archlinux.org/${pkg}.git" "aur-build/${pkg}"; then
                break
              fi
              [[ "$attempt" -lt 5 ]] || { echo "failed to clone AUR package $pkg after 5 attempts" >&2; exit 1; }
              sleep $((attempt * 10))
            done
            runuser -u builder -- bash -lc "cd '$GITHUB_WORKSPACE/aur-build/$pkg' && makepkg --syncdeps --noconfirm --cleanbuild --clean"
            mapfile -t built < <(find "aur-build/$pkg" -maxdepth 1 -name '*.pkg.tar.zst' ! -name '*-debug-*' -print)
            cp "${built[@]}" out/
            pacman -U --noconfirm "${built[@]}"
            echo "::endgroup::"
          done < aur-dependencies-x86_64.txt

      - name: Build local packages in dependency order
        run: |
          set -euo pipefail
          packages=(
            deepseek-dsh
            python-pasimple
            python-pcmflux
            python-pixelflux
            selkies
          )

          for pkg in "${packages[@]}"; do
            test -d "packages/$pkg" || { echo "missing local package: $pkg" >&2; exit 1; }
            echo "::group::Local package: $pkg"
            runuser -u builder -- bash -lc "cd '$GITHUB_WORKSPACE/packages/$pkg' && makepkg --syncdeps --noconfirm --cleanbuild --clean"
            mapfile -t built < <(find "packages/$pkg" -maxdepth 1 -name '*.pkg.tar.zst' ! -name '*-debug-*' -print)
            cp "${built[@]}" out/
            pacman -U --noconfirm "${built[@]}"
            echo "::endgroup::"
          done

      - name: Create pacman repository database
        run: |
          set -euo pipefail
          cd out
          rm -f ./*-debug-*.pkg.tar.zst
          repo-add "${REPO_NAME}.db.tar.gz" ./*.pkg.tar.zst
          ln -sfn "${REPO_NAME}.db.tar.gz" "${REPO_NAME}.db"
          ln -sfn "${REPO_NAME}.files.tar.gz" "${REPO_NAME}.files"
          sha256sum ./*.pkg.tar.zst ./*.db.tar.gz ./*.files.tar.gz > SHA256SUMS

      - name: Stage GitHub Pages site
        env:
          REPO_NAME: ${{ env.REPO_NAME }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf pages-site
          install -d pages-site/x86_64
          cp -a out/. pages-site/x86_64/

          {
            cat <<HTML
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>${REPO_NAME} · Arch Linux 软件源</title>
            <style>
              body { font: 16px/1.6 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
              pre { background: #f6f8fa; padding: 1rem; overflow-x: auto; border-radius: 6px; }
              code { font-family: ui-monospace, monospace; }
              table { border-collapse: collapse; width: 100%; }
              td, th { border-bottom: 1px solid #d0d7de; padding: .4rem .6rem; text-align: left; }
            </style>
          </head>
          <body>
            <h1>${REPO_NAME}</h1>
            <p>Arch Linux pacman 软件源（x86_64），由 GitHub Actions 自动构建。源码仓库：<a href="https://github.com/${REPO_SLUG}">${REPO_SLUG}</a></p>
            <h2>配置</h2>
            <p>在 <code>/etc/pacman.conf</code> 中加入：</p>
            <pre>[${REPO_NAME}]
          SigLevel = Optional TrustAll
          Server = https://mooziisp.github.io/arch-aur-repo/x86_64</pre>
            <p>然后执行 <code>sudo pacman -Sy</code>。</p>
            <h2>软件包</h2>
            <table>
              <tr><th>包名</th><th>版本</th><th>文件</th></tr>
          HTML
            for f in out/*.pkg.tar.zst; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              # Filename: <name>-<pkgver>-<pkgrel>-<arch>.pkg.tar.zst
              stem=${base%.pkg.tar.zst}     # <name>-<pkgver>-<pkgrel>-<arch>
              stem=${stem%-*}               # <name>-<pkgver>-<pkgrel>
              rel=${stem##*-}               # <pkgrel>
              stem=${stem%-*}               # <name>-<pkgver>
              pkg=$(echo "$stem" | sed -E 's/-[^-]+$//')
              ver="${stem#"$pkg"-}-$rel"
              printf '              <tr><td>%s</td><td>%s</td><td><a href="%s">%s</a></td></tr>\n' "$pkg" "$ver" "$base" "$base"
            done
            cat <<HTML
            </table>
            <h2>数据库文件</h2>
            <ul>
              <li><a href="x86_64/${REPO_NAME}.db.tar.gz">${REPO_NAME}.db.tar.gz</a></li>
              <li><a href="x86_64/${REPO_NAME}.files.tar.gz">${REPO_NAME}.files.tar.gz</a></li>
              <li><a href="x86_64/SHA256SUMS">SHA256SUMS</a></li>
            </ul>
          </body>
          </html>
          HTML
          } > pages-site/index.html
          test -s pages-site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload pacman repository to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site/

      - name: Deploy pacman repository to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}

      - name: Upload Actions artifact
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/${REPO_NAME}-x86_64.tar.gz"
          tar -C out -czf "$archive" .
          cp "$archive" "out/${REPO_NAME}-x86_64.tar.gz"

      - name: Publish Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-x86_64
          path: out/${{ env.REPO_NAME }}-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Arch package repository (x86_64)
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: out/*
          body: |
            Rolling x86_64 Arch Linux package repository.

            Add this to `/etc/pacman.conf`:

            ```ini
            [${{ env.REPO_NAME }}]
            SigLevel = Optional TrustAll
            Server = https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}
            ```
